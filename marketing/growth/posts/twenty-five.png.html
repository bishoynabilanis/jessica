<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Cairo'; src: url('file:///Volumes/Extreme%20Pro/تطبيق%20التعليم%20الشامل/marketing/films/jessica-launch/assets/fonts/Cairo.ttf') format('truetype'); font-weight: 200 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1080px; height: 1350px; font-family: 'Cairo', sans-serif; color: #f4f7ff; direction: rtl;
        background:
          radial-gradient(640px 560px at 50% -8%, rgba(33, 230, 201, 0.26), transparent 60%),
          radial-gradient(560px 520px at 92% 106%, rgba(139, 92, 246, 0.4), transparent 62%),
          linear-gradient(165deg, #060a15, #0a1020 60%, #0c1428);
        padding: 86px 80px; position: relative; overflow: hidden; text-align: center;
      }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(680px 680px at 50% 45%, #000 30%, transparent 85%); }
      h1 { position: relative; margin-top: 20px; font-size: 74px; font-weight: 900; line-height: 1.3; }
      h1 b { color: #21e6c9; }
      .sub { position: relative; margin-top: 14px; font-size: 28px; font-weight: 600; color: #b9c7e4; }
      .ringwrap { position: relative; margin: 64px auto 0; width: 460px; height: 460px; }
      svg { transform: rotate(-90deg); }
      .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .inner b { font-size: 150px; font-weight: 900; line-height: 1; color: #21e6c9; text-shadow: 0 0 50px rgba(33,230,201,.45); }
      .inner span { margin-top: 6px; font-size: 32px; font-weight: 800; color: #c3d0e9; }
      .foot { position: absolute; left: 80px; right: 80px; bottom: 76px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .row p { font-size: 30px; font-weight: 800; color: #dbe4f7; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand .j { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #21e6c9, #6b8cff); color: #061018; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
      .brand b { font-size: 20px; letter-spacing: .2em; color: #9fb2d8; }
      .url { margin-top: 14px; font-size: 20px; font-weight: 700; color: #7d8cab; direction: ltr; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <h1>ابدأ <b>قبل</b> ما تحس بالرغبة.</h1>
    <p class="sub">٢٥ دقيقة في ميعاد ثابت — والبدء بيبقى أسهل.</p>

    <div class="ringwrap">
      <svg width="460" height="460" viewBox="0 0 460 460">
        <circle cx="230" cy="230" r="204" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="22" />
        <circle cx="230" cy="230" r="204" fill="none" stroke="#21e6c9" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="1281" stroke-dashoffset="320" />
      </svg>
      <div class="inner"><b>٢٥</b><span>دقيقة</span></div>
    </div>

    <div class="foot">
      <div class="row">
        <p>مش محتاج حماس — محتاج ميعاد.</p>
        <div class="brand"><span class="j">J</span><b>JESSICA</b></div>
      </div>
      <p class="url">is.gd/jessicaapp</p>
    </div>
  </body>
</html>
