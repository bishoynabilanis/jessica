<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Cairo'; src: url('file:///Volumes/Extreme%20Pro/تطبيق%20التعليم%20الشامل/marketing/films/jessica-launch/assets/fonts/Cairo.ttf') format('truetype'); font-weight: 200 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1080px; height: 1350px; font-family: 'Cairo', sans-serif; color: #f4f7ff; direction: rtl;
        background:
          radial-gradient(620px 520px at 88% -6%, rgba(139, 92, 246, 0.45), transparent 62%),
          radial-gradient(560px 480px at 4% 106%, rgba(33, 230, 201, 0.28), transparent 62%),
          linear-gradient(160deg, #060a15, #0a1020 60%, #0c1428);
        padding: 92px 84px; position: relative; overflow: hidden;
      }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(700px 700px at 50% 40%, #000 30%, transparent 85%); }
      .chip { position: relative; display: inline-block; font-size: 22px; font-weight: 800; color: #21e6c9; border: 1.5px solid rgba(33,230,201,.45); border-radius: 999px; padding: 8px 22px; }
      h1 { position: relative; margin-top: 26px; font-size: 86px; font-weight: 900; line-height: 1.24; }
      h1 b { color: #21e6c9; }
      .options { position: relative; margin-top: 54px; display: flex; flex-direction: column; gap: 18px; }
      .opt { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.12); border-radius: 26px; padding: 24px 28px; }
      .opt .dot { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(33,230,201,.55); display: grid; place-items: center; font-size: 20px; font-weight: 900; color: #21e6c9; }
      .opt span { font-size: 38px; font-weight: 800; }
      .foot { position: absolute; left: 84px; right: 84px; bottom: 74px; display: flex; align-items: center; justify-content: space-between; }
      .foot p { font-size: 30px; font-weight: 800; color: #c3d0e9; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand .j { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #21e6c9, #6b8cff); color: #061018; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
      .brand b { font-size: 20px; letter-spacing: .2em; color: #9fb2d8; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <span class="chip">سؤال لأولياء الأمور</span>
    <h1>ابنك بيعمل إيه أول ما يقعد <b>يذاكر؟</b></h1>

    <div class="options">
      <div class="opt"><span class="dot">١</span><span>بيبدأ على طول</span></div>
      <div class="opt"><span class="dot">٢</span><span>بيلف حول الكتاب نص ساعة</span></div>
      <div class="opt"><span class="dot">٣</span><span>بيستنى «المزاج»</span></div>
    </div>

    <div class="foot">
      <p>اكتب في تعليق: هو بيعمل إيه؟</p>
      <div class="brand"><span class="j">J</span><b>JESSICA</b></div>
    </div>
  </body>
</html>
