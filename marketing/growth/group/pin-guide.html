<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 2040px; height: 1886px; position: relative; font-family: 'Cairo', 'Geeza Pro', Arial, sans-serif; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .ring {
        position: absolute; border: 6px solid #ff3b30; border-radius: 999px;
        box-shadow: 0 0 0 10px rgba(255, 59, 48, 0.18);
      }
      .ring.pin { width: 96px; height: 96px; left: 1498px; top: 1176px; }
      .ring.invite { width: 250px; height: 110px; left: 1252px; top: 644px; }
      .callout {
        position: absolute; background: #0b1020; color: #fff; border: 3px solid #ff3b30;
        border-radius: 22px; padding: 20px 26px; font-size: 34px; font-weight: 900; line-height: 1.4;
        box-shadow: 0 24px 60px rgba(0,0,0,.45);
      }
      .callout small { display: block; font-size: 24px; font-weight: 700; color: #c9d4ec; margin-top: 6px; }
      .c1 { right: 60px; top: 1290px; max-width: 880px; }
      .c2 { left: 60px; top: 470px; max-width: 900px; }
      .arrow { position: absolute; font-size: 70px; color: #ff3b30; }
      .a1 { right: 980px; top: 1215px; }
      .a2 { left: 1010px; top: 650px; }
      .banner {
        position: absolute; left: 0; right: 0; bottom: 0; background: rgba(6, 10, 20, 0.94);
        color: #fff; padding: 34px 56px; font-size: 40px; font-weight: 900;
        display: flex; align-items: center; gap: 26px;
      }
      .banner b { color: #21e6c9; }
      .banner span { font-size: 30px; font-weight: 700; color: #c9d4ec; }
    </style>
  </head>
  <body>
    <img class="bg" src="guide-raw.jpg" alt="" />
    <div class="ring invite"></div>
    <div class="callout c2">زر <b>+ Invite</b> بتاع الجروب<small>من هنا تبعت دعوات لمعارفك</small></div>
    <div class="arrow a2">↖</div>

    <div class="ring pin"></div>
    <div class="callout c1">دوس على <b>⋯</b> اللي على يمين البوست<small>مش ⋯ اللي فوق جنب البحث — دي بتاعة الجروب كله</small></div>
    <div class="arrow a1">↘</div>

    <div class="banner">
      <b>بعد ما تفتح القائمة:</b>
      <span>اختار <b style="color:#fff">Pin post</b> (مش Add to featured) — وهتلاقي 📌 فوق البوست.</span>
    </div>
  </body>
</html>
