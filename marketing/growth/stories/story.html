<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Cairo'; src: url('file:///Volumes/Extreme%20Pro/تطبيق%20التعليم%20الشامل/marketing/films/jessica-launch/assets/fonts/Cairo.ttf') format('truetype'); font-weight: 200 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1080px; height: 1920px; font-family: 'Cairo', sans-serif; color: #f4f7ff; direction: rtl;
        background:
          radial-gradient(760px 700px at 85% -6%, rgba(139, 92, 246, 0.42), transparent 62%),
          radial-gradient(700px 620px at 6% 106%, rgba(33, 230, 201, 0.26), transparent 62%),
          linear-gradient(160deg, #060a15, #0a1020 58%, #0c1428);
        position: relative; overflow: hidden;
      }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 72px 72px; -webkit-mask-image: radial-gradient(820px 820px at 50% 42%, #000 28%, transparent 84%); }
      .wrap { position: absolute; inset: 0; padding: 150px 96px 130px; display: flex; flex-direction: column; }
      .mark { display: flex; align-items: center; gap: 14px; }
      .mark .j { width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, #21e6c9, #6b8cff); color: #061018; display: grid; place-items: center; font-weight: 900; font-size: 28px; }
      .mark b { font-size: 24px; letter-spacing: .22em; color: #9fb2d8; }
      .day { margin-inline-start: auto; font-size: 22px; font-weight: 800; color: #7d8cab; }
      .center { flex: 1; display: flex; flex-direction: column; justify-content: center; }
      .kicker { font-size: 30px; font-weight: 800; color: #21e6c9; }
      h1 { margin-top: 24px; font-size: 96px; font-weight: 900; line-height: 1.22; letter-spacing: -1px; }
      h1 em { font-style: normal; color: #21e6c9; }
      p.sub { margin-top: 28px; font-size: 34px; font-weight: 600; color: #b9c7e4; line-height: 1.6; }
      .big { margin-top: 18px; font-size: 300px; font-weight: 900; line-height: 1; color: #21e6c9; text-shadow: 0 0 70px rgba(33,230,201,.45), 0 0 160px rgba(33,230,201,.22); }
      .list { margin-top: 40px; display: flex; flex-direction: column; gap: 22px; }
      .list div { display: flex; gap: 20px; align-items: flex-start; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.12); border-radius: 26px; padding: 22px 26px; }
      .list span { font-size: 34px; font-weight: 700; color: #dbe4f7; line-height: 1.5; }
      .list i { font-style: normal; color: #21e6c9; font-weight: 900; }
      .foot { display: flex; align-items: center; justify-content: space-between; }
      .foot p { font-size: 30px; font-weight: 800; color: #dbe4f7; }
      .foot small { font-size: 24px; font-weight: 700; color: #7d8cab; direction: ltr; }
      .glowbar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #21e6c9, #6b8cff); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="mark"><span class="j">J</span><b>JESSICA</b><span class="day" id="day"></span></div>
      <div class="center" id="body"></div>
      <div class="foot"><p id="foot"></p><small>is.gd/jessicaapp</small></div>
    </div>
    <div class="glowbar"></div>

    <script>
      const DAYS = [
        {
          kicker: 'الحقيقة اللي بتتقال بعد الامتحان',
          html: '<h1>٣ ساعات مذاكرة…<br /><em>ومفيش نتيجة؟</em></h1><p class="sub">المشكلة مش عدد الساعات. ابدأ بـ٢٥ دقيقة في ميعاد ثابت.</p>',
          foot: 'جرّبها بكرة',
        },
        {
          kicker: 'أسرع طريقة تثبّت',
          html: '<h1>اقفل الكتاب<br />واكتب <em>اللي فهمته</em>.</h1><p class="sub">إعادة القراءة بتدّي إحساس كاذب بالفهم. الكتابة من الذاكرة هي الاختبار الحقيقي.</p>',
          foot: '٥ دقايق تكفي',
        },
        {
          kicker: 'الدرجة مش تشخيص',
          html: '<h1>درجة قليلة =<br /><em>مهارة واحدة ناقصة</em>.</h1><p class="sub">مش «مش بيحب المادة». حدد المهارة، راجعها لوحدها، وهتلاقي الفرق.</p>',
          foot: 'ابدأ من الثغرة',
        },
        {
          kicker: 'أرقام حقيقية',
          html: '<div class="big">٣٨</div><h1 style="font-size:72px">كتاب وزارة<br />جوه التطبيق.</h1><p class="sub">٩ صفوف · ٧ لغات · بدون حساب وبدون اشتراك.</p>',
          foot: 'افتح المكتبة',
        },
        {
          kicker: 'مش عارف يبدأ منين؟',
          html: '<h1>١٢ سؤال في دقيقتين<br /><em>يقولك مستواه</em>.</h1><p class="sub">تصحيح فوري، ثغرات واضحة، وخطة على مقاسه.</p>',
          foot: 'اختبار المستوى',
        },
        {
          kicker: 'لما يخلّص الكورس',
          html: '<h1>شهادة إنجاز<br /><em>تتطبع وتحطها</em>.</h1><p class="sub">بالاسم والمستوى والوحدات اللي خلّصها — وQR للتحقق.</p>',
          foot: 'شوف شهادتك',
        },
        {
          kicker: '٣ حاجات قبل ما تذاكر',
          html: '<h1>ابدأ صح<br /><em>في ٣ خطوات</em>.</h1><div class="list"><div><i>١</i><span>ميعاد ثابت بدل «لما يفضى».</span></div><div><i>٢</i><span>أول ٥ دقايق لأصعب حاجة.</span></div><div><i>٣</i><span>بعد كل فقرة: اقفل واكتب.</span></div></div>',
          foot: 'ابنك هيلاحظ الفرق',
        },
        {
          kicker: 'آخر أسبوع قبل الامتحان',
          html: '<h1>ابدأ من<br /><em>اللي إنت ضعيف فيه</em>.</h1><p class="sub">٢٠ دقيقة على أصعب موضوع، ٥ دقايق راحة، وبعدها راجع من دفتر الأخطاء مش من الكتاب.</p>',
          foot: 'خطة آخر أسبوع',
        },
        {
          kicker: 'قبل ما تنام',
          html: '<h1>٥ دقايق مراجعة<br /><em>قبل النوم</em>.</h1><p class="sub">النوم بيثبّت اللي راجعته. راجع عناوين الوحدة بس — من غير تليفون.</p>',
          foot: 'جرّبها الليلة',
        },
        {
          kicker: 'أكبر مشتت',
          html: '<div class="big">١</div><h1 style="font-size:72px">الموبايل في<br />أوضة تانية.</h1><p class="sub">مش في جيبك ولا على المكتب. المسافة دي لوحدها بتفرق أكتر من أي تطبيق.</p>',
          foot: 'ابدأ بـ٢٥ دقيقة',
        },
        {
          kicker: 'أهم دفتر',
          html: '<h1>راجع غلطاتك<br /><em>مش الكتاب</em>.</h1><p class="sub">لكل غلطة: الخطوة الغلط + السبب. قبل الامتحان راجع الدفتر ده بس.</p>',
          foot: 'دفتر الأخطاء',
        },
        {
          kicker: '٥ مش ٢٥',
          html: '<div class="big">٥</div><h1 style="font-size:72px">مسائل متنوعة<br />أحسن من ٢٥ متكررة.</h1><p class="sub">مباشرة · معكوسة · خطوتين · مسألة كلام · مسألة امتحان.</p>',
          foot: 'نوّع التدريب',
        },
        {
          kicker: 'اختبار الفهم الحقيقي',
          html: '<h1>اشرحها<br /><em>لحد تاني</em>.</h1><p class="sub">لو قدرت تشرح الفكرة في ٣ جمل بكلامك، يبقى فهمتها. لو لأ، لسه بتحفظ.</p>',
          foot: 'جرّب دلوقتي',
        },
        {
          kicker: 'كل حاجة في مكان واحد',
          html: '<h1>كتب الوزارة<br /><em>+ مدرس ذكي</em>.</h1><p class="sub">٣٨ كتاب · ٩ صفوف · ٧ لغات · شهادة إنجاز — مجاني وبدون حساب.</p>',
          foot: 'افتح التطبيق',
        },
        {
          kicker: 'امتحان مؤقت',
          html: '<h1>٢٠ سؤال<br /><em>٢٠ دقيقة</em>.</h1><p class="sub">زي ورقة آخر السنة بالظبط — بس بتتصحح في ثانية.</p><div class="list"><div><i>١</i><span>الإجابة مقفولة لحد ما تسلّم.</span></div><div><i>٢</i><span>الورقة كلها بتتصحح سؤال بسؤال، وليه.</span></div><div><i>٣</i><span>أضعف مهارة بتظهر على طول، وكل غلطة بترجع لك.</span></div></div>',
          foot: 'جرّب بنك الأسئلة',
        },
      ]

      const index = Math.max(0, Math.min(DAYS.length - 1, Number(new URLSearchParams(location.search).get('d') || 0)))
      const day = DAYS[index]
      document.getElementById('body').innerHTML = `<p class="kicker">${day.kicker}</p>${day.html}`
      document.getElementById('foot').textContent = day.foot
      const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d])
document.getElementById('day').textContent = `يوم ${ar(index + 1)}`
    </script>
  </body>
</html>
