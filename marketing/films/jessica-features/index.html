<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06070a; }
      #root { position: relative; width: 1080px; height: 1920px; background: #06070a; }
      [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.8" data-width="1080" data-height="1920" data-fps="30">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="test" data-composition-id="test" data-composition-src="compositions/test.html" data-start="3.2" data-duration="3.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="cert" data-composition-id="cert" data-composition-src="compositions/cert.html" data-start="10.2" data-duration="3" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="numbers" data-composition-id="numbers" data-composition-src="compositions/numbers.html" data-start="13.2" data-duration="3" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="16.2" data-duration="3.6" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="bgm" src="assets/music/bed.wav" data-start="0" data-duration="19.8" data-volume="0.3" data-fade-in="0.5" data-fade-out="1.4"></audio>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
