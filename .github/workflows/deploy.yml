name: Deploy Jessica to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and other IndexNow engines about every page in the
      # sitemap (not just the hand-picked ones). Google does not use IndexNow:
      # its sitemap is submitted once in Search Console.
      - name: Ping IndexNow
        run: |
          python3 - <<'PY' > /tmp/indexnow.json
          import json, re
          xml = open('dist/sitemap.xml', encoding='utf-8').read()
          urls = re.findall(r'<loc>(.*?)</loc>', xml)
          print(json.dumps({
              'host': 'bishoynabilanis.github.io',
              'key': '8f3c1d7a9b2e6f405a1c8d3e7b9f2a64',
              'keyLocation': 'https://bishoynabilanis.github.io/jessica/8f3c1d7a9b2e6f405a1c8d3e7b9f2a64.txt',
              'urlList': urls,
          }))
          PY
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @/tmp/indexnow.json || true
