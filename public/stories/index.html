<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ستوريهات جيسيكا — ١٤ يوم</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 28px 18px 60px; font-family: 'Cairo', system-ui, sans-serif; color: #eef3ff;
        background: radial-gradient(700px 500px at 90% -10%, rgba(139, 92, 246, .35), transparent 60%),
          radial-gradient(600px 480px at 0% 110%, rgba(33, 230, 201, .22), transparent 60%), #060a15;
      }
      h1 { font-size: 26px; margin: 0 0 6px; }
      p.hint { margin: 0 0 22px; color: #9fb2d8; font-size: 13px; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
      figure { margin: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; overflow: hidden; background: #0b1226; }
      figure img { display: block; width: 100%; height: auto; }
      figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700; color: #c3d0e9; }
      figcaption a { color: #21e6c9; text-decoration: none; font-size: 11px; }
      figure.on { outline: 2px solid #21e6c9; }
    </style>
  </head>
  <body>
    <h1>ستوريهات جيسيكا — ١٤ يوم</h1>
    <p class="hint">
      دوس على الصورة عشان تفتحها بالحجم الكامل، وبعدين اضغط مطوّل / Save عشان تحفظها على الموبايل.
      انشر واحدة كل يوم من تطبيق فيسبوك: Story → الصورة → نشر.
    </p>
    <div class="grid" id="grid"></div>

    <script>
      const AR = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩']
      const ar = (n) => String(n).replace(/\d/g, (d) => AR[+d])
      const grid = document.getElementById('grid')
      for (let i = 1; i <= 14; i += 1) {
        const figure = document.createElement('figure')
        figure.innerHTML = `
          <a href="./day-${i}.png"><img src="./day-${i}.png" loading="lazy" alt="ستوري يوم ${ar(i)}" /></a>
          <figcaption><span>يوم ${ar(i)}</span><a href="./day-${i}.png" download>تحميل</a></figcaption>
        `
        grid.appendChild(figure)
      }
    </script>
  </body>
</html>
